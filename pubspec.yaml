name: tallee
description: "Tracking App for Card Games"
publish_to: 'none'
version: 0.0.105+585

environment:
  sdk: ^3.13.2

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dropdown_button2: ^3.1.0
  file_picker: ^11.0.3
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_numeric_text: ^1.3.3
  flutter_popup: ^3.3.9
  fluttericon: ^2.0.0
  font_awesome_flutter: ^11.0.0
  fuzzywuzzy: ^1.2.0
  intl: any
  json_schema: ^5.2.2
  lottie: ^3.5.1
  once: ^1.8.0
  open_with_app: ^0.2.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  provider: ^6.1.5
  remove_unused_localizations: ^1.1.2
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  syncfusion_flutter_datepicker: ^34.2.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  arb_utils: ^0.11.1
  build_runner: ^2.16.0
  dart_pubspec_licenses: ^3.2.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sort_pubspec_dependencies: 0.0.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/schema.json
    - assets/logo-animation.json
    - assets/privacy_policy/privacy_policy_en.md
    - assets/privacy_policy/privacy_policy_de.md
