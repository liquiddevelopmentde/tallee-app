name: tallee
description: "Tracking App for Card Games"
publish_to: 'none'
version: 0.0.35+283

environment:
  sdk: ^3.12.1

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_numeric_text: ^1.3.3
