name: tallee
description: "Tracking App for Card Games"
publish_to: 'none'
version: 0.0.77+490

environment:
  sdk: ^3.12.0

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  dropdown_button2: ^3.1.0
  file_picker: ^11.0.2
