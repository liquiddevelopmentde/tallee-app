name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (manual runs only)"
        type: string
        required: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PACKAGE: ${{ vars.APP_IDENTIFIER }}
  IOS_BUNDLE_ID: ${{ vars.APP_IDENTIFIER }}
  APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
  IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
  IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
  GITEA_URL: ${{ vars.GITEA_URL }}
  GITEA_REPO: ${{ vars.GITEA_REPO }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Summary
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISHING: ${{ vars.STORE_DEPLOY_ENABLED == 'true' }}
          TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          {
            echo "### Release build"
            echo ""
            echo "| Version | \`${NAME}\` |"
            echo "| Build | \`${BUILD}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            if [ "$PUBLISHING" = "true" ]; then
              echo "| Publishing | Play (\`${TRACK}\`, draft), TestFlight + App Store draft, Gitea release |"
            else
              echo "| Publishing | **disabled** (\`STORE_DEPLOY_ENABLED\` is not \`true\`), build only, nothing is uploaded |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: meta
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        env:
          API_URL_PROD: ${{ vars.API_URL_PROD }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          if [ -z "$API_URL_PROD" ] || [ -z "$SENTRY_DSN" ]; then
            echo "::error::API_URL_PROD and SENTRY_DSN must be set as repository variables."
            exit 1
          fi
          {
            printf 'API_URL_PROD=%s\n' "$API_URL_PROD"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
          } > .env

      - name: Set up release signing
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ env.ANDROID_PACKAGE }}@${{ needs.meta.outputs.version }}
        run: dart run sentry_dart_plugin

      - name: Collect artifacts
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/tallee-${VERSION}.aab"
          ls -lh dist

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          path: dist/tallee-*.aab
          archive: false
          if-no-files-found: error
          retention-days: 1

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    needs: meta
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        env:
          API_URL_PROD: ${{ vars.API_URL_PROD }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          if [ -z "$API_URL_PROD" ] || [ -z "$SENTRY_DSN" ]; then
            echo "::error::API_URL_PROD and SENTRY_DSN must be set as repository variables."
            exit 1
          fi
          {
            printf 'API_URL_PROD=%s\n' "$API_URL_PROD"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
          } > .env

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/tallee.mobileprovision
          UUID=$(security cms -D -i /tmp/tallee.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/tallee.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed provisioning profile $UUID"

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Write iOS signing xcconfig
        run: |
          cat > ios/Flutter/CodeSigning.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = ${IOS_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${IOS_PROVISIONING_PROFILE_NAME}
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ env.IOS_BUNDLE_ID }}@${{ needs.meta.outputs.version }}
        run: dart run sentry_dart_plugin

      - name: Collect artifact
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/tallee-${VERSION}.ipa"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/tallee-*.ipa
          archive: false
          if-no-files-found: error
          retention-days: 1

  publish_gitea_release:
    name: Attach artifacts to Gitea release
    runs-on: ubuntu-latest
    needs: [meta, build_android, build_ios]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITEA_URL}/api/v1/repos/${GITEA_REPO}"
          
          RELEASE_ID=$(curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Release for tag '${TAG}' does not exist on Gitea."
            exit 1
          fi

          for file in dist/*; do
            name=$(basename "$file")
            encoded=$(jq -rn --arg v "$name" '$v | @uri')
            echo "Uploading ${name} to release ${RELEASE_ID}"
            curl -fsS -X POST -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${file}" \
              "${API}/releases/${RELEASE_ID}/assets?name=${encoded}"
          done

  publish_play_store:
    name: Upload to Google Play
    runs-on: ubuntu-latest
    needs: [meta, build_android]
    if: vars.STORE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: '*.aab'
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: dist/*.aab
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: draft
          releaseName: v${{ needs.meta.outputs.version }}

  publish_appstore:
    name: Upload to App Store (testflight + release draft)
    runs-on: ubuntu-latest
    needs: [meta, build_ios]
    if: vars.STORE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: '*.ipa'
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Resolve IPA path
        id: ipa
        run: echo "path=$(ls dist/*.ipa | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'

      - name: Install App Store Connect CLI
        uses: rudrankriyam/setup-asc@v1

      - name: Stage App Store version
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_NO_UPDATE: "1"
          ASC_TELEMETRY_DISABLED: "1"
          ASC_APP_ID: ${{ env.APPSTORE_APP_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          export ASC_PRIVATE_KEY_B64="$(printf '%s' "$APPSTORE_API_PRIVATE_KEY" | base64 | tr -d '\n')"
          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          echo "Staging App Store version ${APP_VERSION} with build ${BUILD_NUMBER}"

          asc versions create \
            --app "$ASC_APP_ID" \
            --version "$APP_VERSION" \
            --platform IOS \
            --if-exists skip

          asc versions attach-build \
            --app "$ASC_APP_ID" \
            --version "$APP_VERSION" \
            --platform IOS \
            --build-number "$BUILD_NUMBER" \
            --wait \
            --timeout 30m
