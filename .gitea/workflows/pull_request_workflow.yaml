name: "PR Workflow Automation"
on:
  pull_request:
    types: [opened, review_requested, review_request_removed, closed]
  pull_request_review:
    types: [submitted]

jobs:
  sync-workflow-label:
    name: "Sync workflow label"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      API: ${{ gitea.server_url }}/api/v1
      AUTH: 'Authorization: token ${{ secrets.BOT_TOKEN }}'
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      EVENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      STATE: ${{ github.event.review.type }}
      MERGED: ${{ github.event.pull_request.merged }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: "Update label"
        run: |
          set -euo pipefail

          TARGET=""
          case "$EVENT" in
            pull_request)
              case "$ACTION" in
                opened)           TARGET="Workflow/In Progress" ;;
                review_requested) TARGET="Workflow/Ready for Review" ;;
                review_request_removed) TARGET="Workflow/In Progress" ;;
                closed)           if [ "$MERGED" = "true" ]; then TARGET="Workflow/Merged"; else TARGET="Workflow/Abandoned"; fi ;;
              esac ;;
            pull_request_review)
              case "$STATE" in
                pull_request_review_approved) TARGET="Workflow/Ready for Merge" ;;
                pull_request_review_rejected) TARGET="Workflow/Revision" ;;
              esac ;;
          esac

          [ -z "$TARGET" ] && { echo "no state change for $EVENT/$ACTION/$STATE"; exit 0; }

          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "review_requested" ]; then
            NEW="$(printf '%s' "$TITLE" | sed -E 's/^WIP:[[:space:]]*//I')"
            [ "$NEW" != "$TITLE" ] && \
              curl -fsS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
                -d "{\"title\":\"$NEW\"}" "$API/repos/$REPO/pulls/$PR"
          fi

          curl -fsS -H "$AUTH" "$API/repos/$REPO/labels" | python3 -c "import sys,json;d=json.load(sys.stdin);exit(0 if any(x['name']=='$TARGET' for x in d) else 1)" || \
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$TARGET\",\"color\":\"#0E8A16\",\"exclusive\":true}" "$API/repos/$REPO/labels"

          labels=$(curl -fsS -H "$AUTH" "$API/repos/$REPO/issues/$PR/labels")

          for id in $(printf '%s' "$labels" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['id']) for x in d if x['name'].startswith('Workflow/') and x['name']!='$TARGET']"); do
            curl -fsS -X DELETE -H "$AUTH" "$API/repos/$REPO/issues/$PR/labels/$id"
          done

          printf '%s' "$labels" | python3 -c "import sys,json;d=json.load(sys.stdin);exit(0 if any(x['name']=='$TARGET' for x in d) else 1)" || \
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"labels\":[\"$TARGET\"]}" "$API/repos/$REPO/issues/$PR/labels"
