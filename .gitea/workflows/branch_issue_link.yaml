name: "Branch to Issue Link"
on:
  create:

jobs:
  link-branch-to-issue:
    name: "Link new branch to best matching issue"
    # The "create" event also fires for tags; only act on branches.
    if: ${{ gitea.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      API: ${{ gitea.server_url }}/api/v1
      TOKEN: ${{ secrets.BOT_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Minimum similarity (0..1) required to assign a branch to an issue.
      MIN_SCORE: "0.3"
      ORG: liquid-development
      PROJECT_ID: "9"
    steps:
      - name: "Assign branch reference to matching issue"
        id: link
        run: python3 .gitea/scripts/branch_issue_link.py

      - uses: actions/checkout@v4
        if: ${{ steps.link.outputs.issue != '' }}
        with:
          sparse-checkout: .gitea/scripts
      - name: "Move linked issue to In Progress"
        if: ${{ steps.link.outputs.issue != '' }}
        run: python3 .gitea/scripts/project_board.py move "${{ steps.link.outputs.issue }}" "In Progress"
