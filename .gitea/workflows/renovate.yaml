name: Renovate
on:
  schedule:
    - cron: 'TZ=Europe/Berlin 0 11 1,15 * *'

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade git
        run: |
          apt-get update
          apt-get install -y git
          git --version

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.yannick-weigert.com
          RENOVATE_REPOSITORIES: liquid-development/tallee-app
          RENOVATE_GIT_AUTHOR: "Gitea Actions <actions@yannick-weigert.de>"
          RENOVATE_CONFIG_FILE: renovate.json
          LOG_LEVEL: debug
        run: |
          npm install -g renovate
          renovate
