name: Renovate
on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:latest
    steps:
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.yannick-weigert.com/api/v1/
          RENOVATE_REPOSITORIES: liquid-development/tallee-app
          RENOVATE_GIT_AUTHOR: "Gitea Actions <actions@yannick-weigert.de>"
          RENOVATE_BINARY_SOURCE: install
          LOG_LEVEL: debug
        run: renovate