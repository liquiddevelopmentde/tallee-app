name: PR Workflow State
on:
  pull_request:
    types: [opened, review_requested]
  pull_request_review:
    types: [submitted]

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      API: ${{ gitea.server_url }}/api/v1
      AUTH: token ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      EVENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      STATE: ${{ github.event.review.state }}
    steps:
      - name: Set workflow label
        run: |
          set -euo pipefail

          TARGET=""
          case "$EVENT" in
            pull_request)
              case "$ACTION" in
                opened)           TARGET="Workflow/In Progress" ;;
                review_requested) TARGET="Workflow/Ready for Review" ;;
              esac ;;
            pull_request_review)
              case "$STATE" in
                APPROVED)                TARGET="Workflow/Ready for Merge" ;;
                COMMENT|REQUEST_CHANGES) TARGET="Workflow/In Review" ;;
              esac ;;
          esac

          [ -z "$TARGET" ] && { echo "no state change for $EVENT/$ACTION/$STATE"; exit 0; }

          labels=$(curl -fsS -H "$AUTH" "$API/repos/$REPO/issues/$PR/labels")

          for id in $(printf '%s' "$labels" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['id']) for x in d if x['name'].startswith('Workflow/') and x['name']!='$TARGET']"); do
            curl -fsS -X DELETE -H "$AUTH" "$API/repos/$REPO/issues/$PR/labels/$id"
          done

          printf '%s' "$labels" | grep -q "\"name\": \"$TARGET\"" || \
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"labels\":[\"$TARGET\"]}" "$API/repos/$REPO/issues/$PR/labels"
