name: "PR Label Automation"
on:
  pull_request:
    types: [ opened, edited, review_requested, review_request_removed, closed, labeled ]
  pull_request_review:
    types: [ submitted ]

jobs:
  sync-workflow-label:
    name: "Sync workflow label"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      API: ${{ gitea.server_url }}/api/v1
      TOKEN: ${{ secrets.BOT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .gitea/scripts
      - name: "Update label"
        run: python3 .gitea/scripts/pr_label_automation.py
