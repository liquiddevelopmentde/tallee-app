name: Push Pipeline

on:
  push:
    branches:
      - "development"
      - "main"

concurrency:
  group: push-pipeline
  cancel-in-progress: false

jobs:
  bump_build_number:
    name: "Bump build number"
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ gitea.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      - name: Update build number
        id: bump
        uses: stikkyapp/update-pubspec-version@v2
        with:
          strategy: 'none'
          bump-build: true
          path: './pubspec.yaml'

      - name: Commit build number
        run: |
          echo "Bumping ${{ steps.bump.outputs.old-version }} -> ${{ steps.bump.outputs.new-version }}"
          git config --global user.name "Gitea Actions [bot]"
          git config --global user.email "actions@yannick-weigert.de"
          git add pubspec.yaml
          git commit -m "Updated build number [skip ci]"
          git pull --rebase --autostash origin "$BRANCH_NAME"
          git push origin HEAD:$BRANCH_NAME

  generate_licenses:
    name: "Generate OSS licenses"
    needs: bump_build_number
    runs-on: ubuntu-latest
    if: always()
    env:
      GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
      BRANCH_NAME: ${{ gitea.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      # Required for Flutter action
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          git config --global --add safe.directory '*'
          flutter pub get

      - name: Generate oss_licenses.dart
        run: flutter pub run dart_pubspec_licenses:generate -o lib/presentation/views/main_menu/settings_view/licenses/oss_licenses.dart

      - name: Commit license update
        run: |
          if [ -n "$(git status --porcelain lib test)" ]; then
            git config --global user.name "Gitea Actions [bot]"
            git config --global user.email "actions@yannick-weigert.de"
            git add lib test
            git commit -m "Updated licenses [skip ci]"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No changes to commit"
          fi

  generate_localizations:
    name: "Generate localizations"
    needs: bump_build_number
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      # Required for Flutter action
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          git config --global --add safe.directory '*'
          flutter pub get

      - name: Remove unused localization keys
        run: dart run remove_unused_localizations

      - name: Sort .arb-Files
        run: |
          shopt -s nullglob
          for file in lib/l10n/arb/app_*.arb; do
            echo "Sorting $file"
            dart run arb_utils sort "$file"
          done

      - name: Generate localizations
        run: flutter gen-l10n --no-use-deferred-loading

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated localizations
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          BRANCH_NAME: ${{ gitea.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            git config --global user.name "Gitea Actions [bot]"
            git config --global user.email "actions@yannick-weigert.de"
            git add lib/l10n
            git commit -m "Generated localizations [skip ci]"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          else
            echo "No changes to commit"
          fi

  format:
    name: "Format code"
    runs-on: ubuntu-latest
    needs: [ generate_localizations, generate_licenses ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      # Required for Flutter action
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          git config --global --add safe.directory '*'
          flutter pub get

      - name: Remove unused dependencies
        run: |
          dart pub global activate dependency_validator '^5.1.0'

          # exit code 1 means issues found
          OUTPUT=$(dart pub global run dependency_validator 2>&1 || true)
          echo "$OUTPUT"

          # Collect the unused dependencies
          UNUSED=$(echo "$OUTPUT" \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | awk '/^These packages may be unused/ {collect=1; next}
                   collect && /^  \* / {print $2; next}
                   collect {collect=0}')

          if [ -n "$UNUSED" ]; then
            echo "Removing unused dependencies:"
            echo "$UNUSED"
            flutter pub remove $UNUSED
          else
            echo "No unused dependencies found"
          fi

      - name: Sort pubspec.yaml
        run: dart run sort_pubspec_dependencies

      - name: Check code format
        id: check_format
        continue-on-error: true
        run: flutter analyze lib test

      - name: Apply dart fix
        if: steps.check_format.outcome == 'failure'
        run: |
          dart fix --apply lib
          dart fix --apply test

      - name: Apply dart format
        run: dart format lib test

      - name: Commit changes
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          BRANCH_NAME: ${{ gitea.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

          if [ -n "$(git status --porcelain lib test pubspec.yaml pubspec.lock)" ]; then
            git config --global user.name "Gitea Actions [bot]"
            git config --global user.email "actions@yannick-weigert.de"
            git add lib test pubspec.yaml pubspec.lock
            git commit -m "Auto-format code [skip ci]"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No changes to commit"
          fi

      - name: Verify format
        run: flutter analyze lib test

  test:
    name: "Test code"
    needs: format
    if: always()
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required for the Flutter action and SDK download
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq unzip xz-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          git config --global --add safe.directory '*'
          flutter pub get
          flutter --version

      - name: Run tests
        run: |
          touch .env
          flutter test

  build:
    name: "Build for Android"
    needs: [ test, format ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/Android/Sdk
          key: android-sdk-34-34.0.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # Required for Flutter action
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          git config --global --add safe.directory '*'
          flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          API_URL_PROD=${{ secrets.API_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tallee-v${{ steps.get_version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: "tallee_android_v${{ steps.get_version.outputs.version }}"
          path: build/app/outputs/flutter-apk/tallee-v${{ steps.get_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7